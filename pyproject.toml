[project]
name = "thecausalitygame"
version = "0.1.0"
description = "The Causality Game"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Your Org", email = "dev@your.org" }]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.6,<3",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "sympy>=1.12",
  "tqdm>=4.66",
  "typer>=0.12,<1",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "black>=24.8",
  "pip-audit>=2.7",
  "bandit>=1.7",
]
analysis = [
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
]
authoritative = [
  "causal-learn==0.1.4.8",
  "lingam==1.13.0",
  "notears @ git+https://github.com/xunzheng/notears.git@4a9ab19fe502e392503da331773c5223d82d3666",
]

[project.scripts]
tcg = "TheCausalityGame.core.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["TheCausalityGame*", "post_processing*", "scripts*"]

[tool.setuptools.package-data]
"TheCausalityGame.agent.inferers" = ["REFERENCES.md", "r_backends/*.R"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["temp"]

[tool.ruff.lint]
select = ["RUF","ARG","C4","BLE","TRY","ANN","N","D","E","F","I","B","UP","SIM","PL","PERF", "NPY"]
ignore = ["D104","D105","D107"]

[tool.ruff.lint.per-file-ignores]
"TheCausalityGame/agent/helpers/active_query_belief.py" = ["ANN401", "D100", "D101", "D102", "N806", "PLR0913", "PLR2004"]
"TheCausalityGame/agent/helpers/ridge_bootstrap_edge_belief.py" = ["ANN401", "D100", "D101", "D102", "D205", "D400", "N806", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.10"
strict = true
# Extra rules beyond `strict`
disallow_untyped_calls = true  # Prevent calling untyped functions
disallow_any_unimported = true  # Prevent `Any` from missing stubs
warn_unused_configs = true
warn_unreachable = true  # Detect dead code
warn_unused_ignores = true
warn_return_any = true
exclude = ["^tests/data/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q -vv"
markers = [
  "authoritative: integration tests requiring pinned Python and R research backends",
]
